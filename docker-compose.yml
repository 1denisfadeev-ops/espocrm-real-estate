# EspoCRM на своем компьютере
# Урок 5, часть 2: своя CRM без сервера
#
# Движок Docker на этой машине — colima, не Docker Desktop.
# Перед запуском подними его:
#   colima start crm
#
# Запуск (в терминале VS Code, в папке с этим файлом):
#   docker compose -p espocrm up -d
# или просто попроси Claude Code запустить этот файл.
# Флаг -p espocrm обязателен: имя проекта Docker берет из имени папки,
# а в пути есть русские буквы — без флага compose выдаст ошибку.
#
# Первый запуск занимает несколько минут: Docker скачивает CRM и базу.
# Потом открой в браузере: http://localhost:8080
# Логин и пароль администратора задаются в .env (см. .env.example).
# Сразу после первого входа поменяй пароль в профиле.
#
# Остановить CRM:     docker compose -p espocrm stop
# Запустить снова:    docker compose -p espocrm start
# Логи:               docker compose -p espocrm logs -f espocrm
# Данные при этом сохраняются.
#
# После перезагрузки Мака достаточно colima start crm:
# контейнеры поднимутся сами, у них restart: always.
#
# НЕ ЗАПУСКАЙ docker compose down --volumes (или -v): это удалит всю базу CRM.
# Удаление тома espocrm_espocrm-db тоже сотрет все данные CRM.
#
# Основа: официальный пример из репозитория espocrm/espocrm-docker.

services:

  # База данных: здесь хранятся клиенты, сделки, задачи
  espocrm-db:
    image: mariadb:latest
    container_name: ${ESPO_CONTAINER:-espocrm}-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?нужен .env, см. .env.example}
      MARIADB_DATABASE: espocrm
      MARIADB_USER: espocrm
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?нужен .env, см. .env.example}
    volumes:
      - espocrm-db:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      start_period: 10s
      timeout: 10s
      retries: 3

  # Сама CRM, открывается на http://localhost:8080
  espocrm:
    image: espocrm/espocrm
    container_name: ${ESPO_CONTAINER:-espocrm}
    environment:
      ESPOCRM_DATABASE_PLATFORM: Mysql
      ESPOCRM_DATABASE_HOST: espocrm-db
      ESPOCRM_DATABASE_USER: espocrm
      ESPOCRM_DATABASE_PASSWORD: ${MARIADB_PASSWORD:?нужен .env, см. .env.example}
      # Логин и пароль админа. Срабатывают только при самом первом запуске,
      # дальше пароль меняется уже внутри CRM.
      ESPOCRM_ADMIN_USERNAME: ${ESPOCRM_ADMIN_USERNAME:-admin}
      ESPOCRM_ADMIN_PASSWORD: ${ESPOCRM_ADMIN_PASSWORD:?нужен .env, см. .env.example}
      ESPOCRM_SITE_URL: "http://localhost:${HTTP_PORT:-8080}"
    # Сохраняем только папки с данными и настройками. Всю /var/www/html
    # монтировать нельзя: с версии 10 в таком режиме CRM не устанавливается.
    volumes:
      - espocrm-data:/var/www/html/data
      - espocrm-custom:/var/www/html/custom
      - espocrm-custom-client:/var/www/html/client/custom
    restart: always
    depends_on:
      espocrm-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bin/command", "app-check"]
      start_period: 20s
      interval: 60s
      timeout: 20s
      retries: 3
    ports:
      - ${HTTP_PORT:-8080}:80

  # Фоновые задачи: напоминания и плановые действия
  espocrm-daemon:
    image: espocrm/espocrm
    container_name: ${ESPO_CONTAINER:-espocrm}-daemon
    volumes_from:
      - espocrm
    restart: always
    depends_on:
      espocrm:
        condition: service_healthy
    entrypoint: docker-daemon.sh

  # Мгновенные уведомления в интерфейсе
  espocrm-websocket:
    image: espocrm/espocrm
    container_name: ${ESPO_CONTAINER:-espocrm}-websocket
    environment:
      ESPOCRM_CONFIG_USE_WEB_SOCKET: "true"
      ESPOCRM_CONFIG_WEB_SOCKET_URL: "ws://localhost:${WS_PORT:-8081}"
      ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBSCRIBER_DSN: "tcp://*:7777"
      ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBMISSION_DSN: "tcp://espocrm-websocket:7777"
    volumes_from:
      - espocrm
    restart: always
    depends_on:
      espocrm:
        condition: service_healthy
    entrypoint: docker-websocket.sh
    ports:
      - ${WS_PORT:-8081}:8080

volumes:
  espocrm-db:
  espocrm-data:
  espocrm-custom:
  espocrm-custom-client:
